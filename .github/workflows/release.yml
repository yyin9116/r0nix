name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows
            os: windows-latest
            bundles: "nsis,msi"
            artifact_name: r0nix-windows
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macos
            os: macos-latest
            bundles: "app,dmg"
            artifact_name: r0nix-macos
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: npm ci

      - name: Install PyMuPDF
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf==1.26.7

      - name: Prepare Embedded Python Runtime
        run: python scripts/prepare-python-runtime.py --runtime-dir src-tauri/runtime

      - name: Check Python Runtime Hygiene
        run: npm run check:runtime-hygiene

      - name: Check Release Readiness
        run: npm run check:release

      - name: Check P-Level Contracts
        run: npm run check:contracts

      - name: Run P-Level Fixtures
        run: npm run test:fixtures

      - name: Run Browser P-Level E2E
        run: npm run test:e2e

      - name: Check macOS signing secrets
        id: macos_signing
        if: matrix.platform.name == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [[ -n "$APPLE_CERTIFICATE_SECRET" ]] || missing+=("APPLE_CERTIFICATE")
          [[ -n "$APPLE_CERTIFICATE_PASSWORD_SECRET" ]] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          [[ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]] || missing+=("APPLE_SIGNING_IDENTITY")
          [[ -n "$APPLE_ID_SECRET" ]] || missing+=("APPLE_ID")
          [[ -n "$APPLE_PASSWORD_SECRET" ]] || missing+=("APPLE_PASSWORD")
          [[ -n "$APPLE_TEAM_ID_SECRET" ]] || missing+=("APPLE_TEAM_ID")

          if (( ${#missing[@]} > 0 )); then
            printf 'macOS Developer ID signing and notarization secrets are missing: %s\n' "${missing[*]}" >&2
            printf 'Building an ad-hoc macOS package. It is not notarized; users may need to approve it manually in macOS Security settings.\n' >&2
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"

      - name: Build Tauri Bundles
        if: matrix.platform.name != 'macos'
        run: npx tauri build --bundles "${{ matrix.platform.bundles }}"

      - name: Smoke test installed Windows application
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Build Ad-Hoc macOS Bundles
        if: matrix.platform.name == 'macos' && steps.macos_signing.outputs.has_secrets != 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          bash scripts/build-macos-bundle.sh

      - name: Build Signed and Notarized macOS Bundles
        if: matrix.platform.name == 'macos' && steps.macos_signing.outputs.has_secrets == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          source scripts/macos-signing.sh
          trap cleanup_macos_signing EXIT
          setup_macos_signing
          npx tauri build --bundles app
          bash scripts/patch-macos-bundle.sh "src-tauri/target/release/bundle/macos/r0nix.app"
          bash scripts/notarize-macos-artifact.sh "src-tauri/target/release/bundle/macos/r0nix.app"
          version="$(node -p 'JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json", "utf8")).version')"
          architecture="$(uname -m)"
          if [[ "$architecture" == "arm64" ]]; then architecture="aarch64"; fi
          dmg_path="src-tauri/target/release/bundle/dmg/r0nix_${version}_${architecture}.dmg"
          bash scripts/create-macos-dmg.sh "src-tauri/target/release/bundle/macos/r0nix.app" "$dmg_path"
          bash scripts/macos-bundle-smoke.sh "src-tauri/target/release/bundle/macos/r0nix.app"
          bash scripts/macos-app-process-smoke.sh "src-tauri/target/release/bundle/macos/r0nix.app"
          bash scripts/notarize-macos-artifact.sh "$dmg_path"

      - name: Verify macOS DMG
        if: matrix.platform.name == 'macos'
        shell: bash
        run: |
          for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Release Notes
        shell: bash
        # 发布说明取自 tag 的消息体。这里有两个实测出来的坑：
        #
        # 1) actions/checkout 会把 refs/tags/<tag> **强制重指到提交**：它的第二次
        #    fetch refspec 源用的是剥离后的提交 sha（日志里一条 `t [tag update]
        #    <sha> -> vX`），于是本地那个 tag 退化成轻量 tag。后果有两个：
        #      - `git cat-file -e "vX^{tag}"` 判假，写 notes 的分支整块被跳过；
        #      - 即便不跳过，`%(contents)` 对轻量 tag 返回的是**提交标题**而非 tag 消息。
        #    所以先把**远端真正的 tag 引用**重新 fetch 一遍，拿回注释 tag 对象。
        #
        # 2) notes 写到 $RUNNER_TEMP，而不是仓库根目录。仓库里有一个被追踪的
        #    RELEASE_NOTES.md（内容停在很旧的版本）；只要上面的分支没写成功，它还是
        #    个非空文件，就会被原样当成"本次"发布说明发出去 —— 静默发错内容，且
        #    工作流全绿。写到仓库外，这个失败模式在结构上就不可能发生。
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          rm -f "$notes_file"

          if git ls-remote --exit-code --tags origin "refs/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            git fetch --force --no-recurse-submodules origin \
              "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          fi

          if git cat-file -e "${GITHUB_REF_NAME}^{tag}" 2>/dev/null; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$notes_file"
            echo "release notes: 取自注释 tag ${GITHUB_REF_NAME} 的消息体"
          else
            echo "release notes: ${GITHUB_REF_NAME} 不是注释 tag，改用兜底文案" >&2
          fi

          if [[ ! -s "$notes_file" ]]; then
            {
              echo "r0nix ${GITHUB_REF_NAME}"
              echo
              echo "本次发布包含最新的阅读工作台、网页浏览、Markdown/PDF 阅读辅助和稳定性改进。"
            } > "$notes_file"
            echo "release notes: tag 消息体为空，已写入兜底文案" >&2
          fi

          echo "release notes: $(wc -c < "$notes_file" | tr -d ' ') 字节，首行「$(head -1 "$notes_file")」"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.dmg
