name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows
            os: windows-latest
            bundles: "nsis,msi"
            artifact_name: r0nix-windows
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macos
            os: macos-latest
            bundles: "app,dmg"
            artifact_name: r0nix-macos
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: npm ci

      - name: Install PyMuPDF
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf==1.26.7

      - name: Prepare Embedded Python Runtime
        run: python scripts/prepare-python-runtime.py --runtime-dir src-tauri/runtime

      - name: Check macOS signing secrets
        id: macos_signing
        if: matrix.platform.name == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [[ -n "$APPLE_CERTIFICATE_SECRET" ]] || missing+=("APPLE_CERTIFICATE")
          [[ -n "$APPLE_CERTIFICATE_PASSWORD_SECRET" ]] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          [[ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]] || missing+=("APPLE_SIGNING_IDENTITY")
          [[ -n "$APPLE_ID_SECRET" ]] || missing+=("APPLE_ID")
          [[ -n "$APPLE_PASSWORD_SECRET" ]] || missing+=("APPLE_PASSWORD")
          [[ -n "$APPLE_TEAM_ID_SECRET" ]] || missing+=("APPLE_TEAM_ID")

          if (( ${#missing[@]} > 0 )); then
            printf 'macOS Developer ID signing and notarization secrets are missing: %s\n' "${missing[*]}" >&2
            printf 'Building an ad-hoc signed macOS package instead. This package is usable, but users may need to approve it manually in macOS Security settings.\n' >&2
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"

      - name: Build Tauri Bundles
        if: matrix.platform.name != 'macos'
        run: npx tauri build --bundles "${{ matrix.platform.bundles }}"

      - name: Build Ad-Hoc macOS Bundles
        if: matrix.platform.name == 'macos' && steps.macos_signing.outputs.has_secrets != 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --bundles "${{ matrix.platform.bundles }}"

      - name: Build Signed and Notarized macOS Bundles
        if: matrix.platform.name == 'macos' && steps.macos_signing.outputs.has_secrets == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --bundles "${{ matrix.platform.bundles }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Release Notes
        shell: bash
        run: |
          if git cat-file -e "${GITHUB_REF_NAME}^{tag}" 2>/dev/null; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi

          if [[ ! -s RELEASE_NOTES.md ]]; then
            {
              echo "r0nix ${GITHUB_REF_NAME}"
              echo
              echo "本次发布包含最新的阅读工作台、网页浏览、Markdown/PDF 阅读辅助和稳定性改进。"
            } > RELEASE_NOTES.md
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.dmg
