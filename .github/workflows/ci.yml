name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  check:
    name: Build and Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: npm ci

      - name: Install PyMuPDF
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf==1.26.7

      - name: Prepare Embedded Python Runtime
        run: python scripts/prepare-python-runtime.py --runtime-dir src-tauri/runtime

      - name: Check Python Runtime Hygiene
        run: npm run check:runtime-hygiene

      - name: Frontend Build
        run: npm run build

      - name: Contract Checks
        run: npm run check:contracts

      - name: Frontend Fixture Tests
        run: npm run test:fixtures

      - name: Browser P-Level E2E
        # 脚本内已有 12 分钟看门狗；这是第二道闸：任何原因都不该让这一步挂满
        # GitHub 默认的 6 小时（macOS 实测全程 77s，15 分钟是充裕上限）。
        timeout-minutes: 15
        run: npm run test:e2e

      - name: Rust Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Embedded PDF Runtime Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --ignored
