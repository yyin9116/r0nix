<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/r0nix-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>r0nix</title>
    <script>
      /*
       * 首帧前定主题。语义与 App.tsx 的 resolveTheme 完全一致；
       * 放在这里是为了消除「暗色下先闪一帧浅色」——App 的主题是在 useEffect
       * 里才落到 html 上的，那一帧会露出 body 的浅色底。
       */
      (function () {
        var dark;
        try {
          var raw = localStorage.getItem("pdf_reader_user_settings_v2");
          var mode = raw ? (JSON.parse(raw) || {}).themeMode : "system";
          dark =
            mode === "dark" ||
            (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (err) {
          dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        }
        var el = document.documentElement;
        el.classList.toggle("dark", dark);
        el.setAttribute("data-theme", dark ? "dark" : "light");
        el.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      /*
       * 启动屏必须自包含：此刻 tokens.css 尚未加载，无法使用 var(--surface-*)。
       * 下面内联的是 zinc 令牌的解析值，与 src/tokens.css 保持一致 —— 改令牌时请同步此处。
       *   surface-app #fafafa/#09090b · surface-panel #ffffff/#18181b
       *   border-subtle #e4e4e7/#27272a · border-default #d4d4d8/#3f3f46
       *   content-primary #18181b/#f4f4f5 · content-muted #71717a/#a1a1aa
       *   强调色（zinc 默认）浅 #18181b 深 #f4f4f5
       */
      :root {
        --splash-app: #fafafa;
        --splash-panel: #ffffff;
        --splash-border: #e4e4e7;
        --splash-track: #d4d4d8;
        --splash-text: #18181b;
        --splash-muted: #71717a;
        --splash-accent: #18181b;
        --splash-shadow: 0 24px 48px rgba(24, 24, 27, 0.16);
      }
      html.dark,
      html[data-theme="dark"] {
        --splash-app: #09090b;
        --splash-panel: #18181b;
        --splash-border: #27272a;
        --splash-track: #3f3f46;
        --splash-text: #f4f4f5;
        --splash-muted: #a1a1aa;
        --splash-accent: #f4f4f5;
        --splash-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
      }
      /* 禁用 JS 时的兜底：脚本没跑起来就跟随系统 */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --splash-app: #09090b;
          --splash-panel: #18181b;
          --splash-border: #27272a;
          --splash-track: #3f3f46;
          --splash-text: #f4f4f5;
          --splash-muted: #a1a1aa;
          --splash-accent: #f4f4f5;
          --splash-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
        }
      }
      body {
        margin: 0;
        background: var(--splash-app);
      }
      /* 层级用字面量：启动屏必须在所有内容之上，而 --z-* 令牌此时不可用 */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--splash-app);
        transition: opacity 240ms ease;
      }
      #app-splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      /* 字体刻意用**系统栈**，不声明 Inter / Noto Sans SC。
       * 这两个 webfont 由 index.css 的 Google Fonts @import 异步拉取，首帧时
       * 一定还没到；一旦声明了它们，启动屏就会先按 fallback 排版、
       * 字体到位后再重排一次 —— 表现为「加载页上的字变了一次」（2026-10-08 实测）。
       * 系统栈在第一帧就是最终形态，不可能闪。
       * splash 与 App 之间仍可能有一次字体切换（App 用 Inter），但那一次被
       * 240ms 的淡出掩盖，且 main.tsx 会等 document.fonts.ready 才淡出，
       * 所以实际上不可见。 */
      .splash-card {
        min-width: 280px;
        padding: 28px 24px 20px;
        border-radius: 16px;
        border: 1px solid var(--splash-border);
        background: var(--splash-panel);
        box-shadow: var(--splash-shadow);
        text-align: center;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      .splash-brand {
        width: 52px;
        height: 52px;
        object-fit: contain;
        display: block;
        margin: 0 auto 12px;
        border-radius: 12px;
      }
      .splash-title {
        margin: 0;
        color: var(--splash-text);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .splash-version {
        margin-top: 4px;
        color: var(--splash-muted);
        font-size: 12px;
      }
      .splash-loader {
        width: 28px;
        height: 28px;
        margin: 16px auto 10px;
        border-radius: 50%;
        border: 2px solid var(--splash-track);
        border-top-color: var(--splash-accent);
        animation: splash-spin 1s linear infinite;
      }
      .splash-text {
        margin: 0;
        color: var(--splash-muted);
        font-size: 12px;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }
        .splash-loader {
          animation: none;
        }
      }
      @keyframes splash-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite">
      <div class="splash-card">
        <img class="splash-brand" src="/r0nix-icon.svg" alt="" />
        <h1 class="splash-title">r0nix</h1>
        <div class="splash-version" id="app-splash-version">v%APP_VERSION%</div>
        <div class="splash-loader"></div>
        <p class="splash-text">Loading reader workspace...</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
